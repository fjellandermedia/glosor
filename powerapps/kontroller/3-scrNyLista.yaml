- btnLaggTillListor:
    Control: Classic/Button@2.2.0
    Properties:
      Text: ="Lägg till glosorna"
      X: =500
      Y: =614
      Width: =160
      Height: =40
      OnSelect: |-
        =ForAll(
            cmbListor.SelectedItems As lista,
            ForAll(
                Split(lista.GlosaIDs, ";") As idText,
                If(
                    !IsBlank(Trim(idText.Value)) && IsBlank(LookUp(colValda, ID = Value(idText.Value))),
                    With(
                        { g: LookUp(Glosor, ID = Value(idText.Value)) },
                        If(!IsBlank(g.ID), Collect(colValda, { ID: g.ID, Title: g.Title, Svenska: g.Svenska, Genus: g.Genus, Sprak: g.Sprak }))
                    )
                )
            )
        );
        Reset(cmbListor)
      Fill: =RGBA(255, 255, 255, 1)
      Color: =RGBA(47, 91, 211, 1)
      HoverFill: =RGBA(231, 237, 252, 1)
      HoverColor: =RGBA(47, 91, 211, 1)
      PressedFill: =RGBA(231, 237, 252, 1)
      BorderColor: =RGBA(47, 91, 211, 1)
      BorderThickness: =2
      RadiusTopLeft: =8
