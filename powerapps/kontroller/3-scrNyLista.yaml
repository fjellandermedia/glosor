- galKalla:
    Control: Gallery@2.15.0
    Variant: Vertical
    Properties:
      Items: |-
        =If(
            chkFristaende.Value,
            Filter(Glosor, BokID = 0, Sprak = cmbLSprak.Selected.Kod),
            Filter(Glosor, KapitelID = Coalesce(cmbLKapitel.Selected.ID, -1))
        )
      X: =20
      Y: =240
      Width: =640
      Height: =330
      TemplateSize: =44
      TemplatePadding: =0
      Fill: =RGBA(255, 255, 255, 1)
      BorderColor: =RGBA(221, 226, 236, 1)
      BorderThickness: =1
      ShowScrollbar: =true
    Children:
      - chkGlosa:
          Control: Classic/CheckBox@2.1.0
          Properties:
            Text: =""
            X: =8
            Y: =6
            Width: =40
            Height: =32
            Size: =12
            Color: =RGBA(28, 35, 51, 1)
            CheckboxBorderColor: =RGBA(47, 91, 211, 1)
            Default: =!IsBlank(LookUp(colValda, ID = ThisItem.ID))
            OnCheck: |-
              =If(IsBlank(LookUp(colValda, ID = ThisItem.ID)), Collect(colValda, { ID: ThisItem.ID, Title: ThisItem.Title, Svenska: ThisItem.Svenska, Genus: ThisItem.Genus, Sprak: ThisItem.Sprak }))
            OnUncheck: =RemoveIf(colValda, ID = ThisItem.ID)
      - lblKMal:
          Control: Label@2.5.1
          Properties:
            Text: =ThisItem.Title
            X: =50
            Y: =0
            Width: =285
            Height: =44
            Color: =Switch(ThisItem.Genus, "f", RGBA(211, 47, 47, 1), "m", RGBA(31, 95, 209, 1), "n", RGBA(22, 138, 61, 1), RGBA(28, 35, 51, 1))
