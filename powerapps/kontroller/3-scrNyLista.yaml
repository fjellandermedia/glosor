- conNyL:
    Control: GroupContainer@1.5.0
    Variant: AutoLayout
    Properties:
      LayoutDirection: =LayoutDirection.Vertical
      LayoutAlignItems: =LayoutAlignItems.Stretch
      LayoutGap: =0
      Fill: =Tema.Bakgrund
      DropShadow: =DropShadow.None
      X: =0
      Y: =0
      Width: =Parent.Width
      Height: =Parent.Height
    Children:
      - conNyLHuvud:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            LayoutDirection: =LayoutDirection.Horizontal
            LayoutAlignItems: =LayoutAlignItems.Center
            LayoutGap: =12
            Fill: =Tema.Primar
            DropShadow: =DropShadow.None
            Height: =64
            PaddingLeft: =24
            PaddingRight: =24
          Children:
            - txtNyLTitel:
                Control: ModernText@1.0.0
                Properties:
                  Text: =If(IsBlank(varRedigeraLista), "Skapa gloslista", "Redigera gloslista")
                  Size: =20
                  FontColor: =Tema.TextPaPrimar
                  Height: =36
                  FontWeight: =FontWeight.Bold
                  FillPortions: =1
            - btnNyLHem:
                Control: ModernButton@1.0.0
                Properties:
                  Text: ="Start"
                  OnSelect: =Navigate(scrStart, ScreenTransition.None)
                  Appearance: =ButtonAppearance.Secondary
                  BasePaletteColor: =Tema.Primar
                  Height: =40
                  Width: =120
      - conNyLKropp:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            LayoutDirection: =LayoutDirection.Horizontal
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutGap: =16
            Fill: =RGBA(0, 0, 0, 0)
            DropShadow: =DropShadow.None
            FillPortions: =1
            PaddingTop: =16
            PaddingBottom: =16
            PaddingLeft: =16
            PaddingRight: =16
          Children:
            - conNyLKalla:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutGap: =8
                  Fill: =Tema.Yta
                  DropShadow: =DropShadow.None
                  BorderColor: =Tema.Linje
                  BorderThickness: =1
                  RadiusTopLeft: =12
                  RadiusTopRight: =12
                  RadiusBottomLeft: =12
                  RadiusBottomRight: =12
                  PaddingTop: =16
                  PaddingBottom: =16
                  PaddingLeft: =16
                  PaddingRight: =16
                  LayoutOverflowY: =LayoutOverflow.Scroll
                  FillPortions: =1
                  LayoutMinWidth: =420
                Children:
                  - txtNyLSteg1:
                      Control: ModernText@1.0.0
                      Properties:
                        Text: ="1. Välj glosor"
                        Size: =14
                        FontColor: =Tema.Brodtext
                        Height: =30
                        FontWeight: =FontWeight.Semibold
                  - conNyLBokKapitel:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        LayoutGap: =8
                        Fill: =RGBA(0, 0, 0, 0)
                        DropShadow: =DropShadow.None
                        Height: =40
                      Children:
                        - cmbLBok:
                            Control: ModernCombobox@1.1.2
                            Properties:
                              Items: =Sort(glosor_bocker, Title)
                              ItemDisplayText: =ThisItem.Title
                              SelectMultiple: =false
                              Placeholder: ="Bok"
                              Height: =40
                              FillPortions: =1
                              OnChange: =Reset(cmbLKapitel)
                              DisplayMode: =If(chkFristaende.Checked, DisplayMode.Disabled, DisplayMode.Edit)
                        - cmbLKapitel:
                            Control: ModernCombobox@1.1.2
                            Properties:
                              Items: =Sort(Filter(glosor_kapitel, BokID = Coalesce(cmbLBok.Selected.ID, -1)), Ordning)
                              ItemDisplayText: =ThisItem.Title
                              SelectMultiple: =false
                              Placeholder: ="Kapitel"
                              Height: =40
                              FillPortions: =1
                              DisplayMode: =If(chkFristaende.Checked, DisplayMode.Disabled, DisplayMode.Edit)
                  - conNyLFristaende:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        LayoutGap: =8
                        Fill: =RGBA(0, 0, 0, 0)
                        DropShadow: =DropShadow.None
                        Height: =40
                      Children:
                        - chkFristaende:
                            Control: ModernCheckbox@1.0.2
                            Properties:
                              Label: ="Fristående glosor (utan bok)"
                              Height: =36
                              FillPortions: =1
                        - cmbLSprak:
                            Control: ModernCombobox@1.1.2
                            Properties:
                              Items: =Sprakval
                              ItemDisplayText: =ThisItem.Namn
                              SelectMultiple: =false
                              Placeholder: ="Språk"
                              Height: =40
                              FillPortions: =1
                              Visible: =chkFristaende.Checked
                  - conNyLMarkera:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        LayoutGap: =8
                        Fill: =RGBA(0, 0, 0, 0)
                        DropShadow: =DropShadow.None
                        Height: =40
                      Children:
                        - btnMarkeraAlla:
                            Control: ModernButton@1.0.0
                            Properties:
                              Text: ="Markera alla"
                              OnSelect: |-
                                =Collect(colValda, ForAll(Filter(galKalla.AllItems, !(ID in colValda.ID)) As g, { ID: g.ID, Title: g.Title, Svenska: g.Svenska, Genus: g.Genus, Sprak: g.Sprak }))
                              Appearance: =ButtonAppearance.Secondary
                              BasePaletteColor: =Tema.Primar
                              Height: =40
                              Width: =150
                        - btnAvmarkeraAlla:
                            Control: ModernButton@1.0.0
                            Properties:
                              Text: ="Avmarkera alla"
                              OnSelect: =RemoveIf(colValda, ID in galKalla.AllItems.ID)
                              Appearance: =ButtonAppearance.Secondary
                              BasePaletteColor: =Tema.Primar
                              Height: =40
                              Width: =150
                  - galKalla:
                      Control: Gallery@2.15.0
                      Variant: BrowseLayout_Vertical_TwoTextOneImageVariant_ver5.0
                      Properties:
                        Items: |-
                          =If(
                              chkFristaende.Checked,
                              Filter(glosor_glosor, BokID = 0, Sprak = cmbLSprak.Selected.Kod),
                              Filter(glosor_glosor, KapitelID = Coalesce(cmbLKapitel.Selected.ID, -1))
                          )
                        TemplateSize: =48
                        TemplatePadding: =0
                        FillPortions: =1
                        LayoutMinHeight: =160
                        Fill: =RGBA(0, 0, 0, 0)
                        BorderThickness: =0
                        ShowScrollbar: =true
                      Children:
                        - chkGlosa:
                            Control: ModernCheckbox@1.0.2
                            Properties:
                              Label: =""
                              Height: =36
                              Checked: =!IsBlank(LookUp(colValda, ID = ThisItem.ID))
                              OnCheck: |-
                                =If(IsBlank(LookUp(colValda, ID = ThisItem.ID)), Collect(colValda, { ID: ThisItem.ID, Title: ThisItem.Title, Svenska: ThisItem.Svenska, Genus: ThisItem.Genus, Sprak: ThisItem.Sprak }))
                              OnUncheck: =RemoveIf(colValda, ID = ThisItem.ID)
                              X: =8
                              Y: =6
                              Width: =40
                        - txtKMal:
                            Control: ModernText@1.0.0
                            Properties:
                              Text: =ThisItem.Title
                              Size: =12
                              FontColor: =Switch(ThisItem.Genus, "f", Tema.GenusF, "m", Tema.GenusM, "n", Tema.GenusN, Tema.Brodtext)
                              Height: =28
                              FontWeight: =FontWeight.Semibold
                              X: =52
                              Y: =10
                              Width: =(Parent.TemplateWidth - 60) / 2
                        - txtKSv:
                            Control: ModernText@1.0.0
                            Properties:
                              Text: =ThisItem.Svenska
                              Size: =12
                              FontColor: =Tema.Brodtext
                              Height: =28
                              X: =56 + (Parent.TemplateWidth - 60) / 2
                              Y: =10
                              Width: =(Parent.TemplateWidth - 60) / 2
                        - rectKLinje:
                            Control: Rectangle@2.3.0
                            Properties:
                              X: =0
                              Y: =Parent.TemplateHeight - 1
                              Width: =Parent.TemplateWidth
                              Height: =1
                              Fill: =Tema.Linje
                  - txtNyLListor:
                      Control: ModernText@1.0.0
                      Properties:
                        Text: ="…eller slå ihop befintliga gloslistor"
                        Size: =14
                        FontColor: =Tema.Brodtext
                        Height: =30
                        FontWeight: =FontWeight.Semibold
                  - conNyLListor:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        LayoutGap: =8
                        Fill: =RGBA(0, 0, 0, 0)
                        DropShadow: =DropShadow.None
                        Height: =40
                      Children:
                        - cmbListor:
                            Control: ModernCombobox@1.1.2
                            Properties:
                              Items: =Sort(glosor_gloslistor, Title)
                              ItemDisplayText: =ThisItem.Title
                              SelectMultiple: =true
                              Placeholder: ="Välj en eller flera listor"
                              Height: =40
                              FillPortions: =1
                        - btnLaggTillListor:
                            Control: ModernButton@1.0.0
                            Properties:
                              Text: ="Lägg till glosorna"
                              OnSelect: |-
                                =ForAll(
                                    cmbListor.SelectedItems As lista,
                                    ForAll(
                                        Split(lista.GlosaIDs, ";") As idText,
                                        If(
                                            !IsBlank(Trim(idText.Value)) && IsBlank(LookUp(colValda, ID = Value(idText.Value))),
                                            With(
                                                { g: LookUp(glosor_glosor, ID = Value(idText.Value)) },
                                                If(!IsBlank(g.ID), Collect(colValda, { ID: g.ID, Title: g.Title, Svenska: g.Svenska, Genus: g.Genus, Sprak: g.Sprak }))
                                            )
                                        )
                                    )
                                );
                                Reset(cmbListor)
                              Appearance: =ButtonAppearance.Secondary
                              BasePaletteColor: =Tema.Primar
                              Height: =40
                              Width: =170
                  - txtNyLListorInfo:
                      Control: ModernText@1.0.0
                      Properties:
                        Text: ="Glosorna återanvänds – inget dupliceras. Samma glosa läggs bara till en gång."
                        Size: =10
                        FontColor: =Tema.TextDampad
                        Height: =22
            - conNyLLista:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutGap: =8
                  Fill: =Tema.Yta
                  DropShadow: =DropShadow.None
                  BorderColor: =Tema.Linje
                  BorderThickness: =1
                  RadiusTopLeft: =12
                  RadiusTopRight: =12
                  RadiusBottomLeft: =12
                  RadiusBottomRight: =12
                  PaddingTop: =16
                  PaddingBottom: =16
                  PaddingLeft: =16
                  PaddingRight: =16
                  LayoutOverflowY: =LayoutOverflow.Scroll
                  FillPortions: =1
                  LayoutMinWidth: =420
                Children:
                  - txtNyLSteg2:
                      Control: ModernText@1.0.0
                      Properties:
                        Text: ="2. Din gloslista"
                        Size: =14
                        FontColor: =Tema.Brodtext
                        Height: =30
                        FontWeight: =FontWeight.Semibold
                  - txtListNamn:
                      Control: ModernTextInput@1.1.2
                      Properties:
                        Value: =If(IsBlank(varRedigeraLista), varMallNamn, varRedigeraLista.Title)
                        Placeholder: ="Namn, t.ex. Kapitel 3 glosor"
                        Height: =40
                  - txtListBeskr:
                      Control: ModernTextInput@1.1.2
                      Properties:
                        Value: =If(IsBlank(varRedigeraLista), "", varRedigeraLista.Beskrivning)
                        Placeholder: ="Beskrivning (valfri), t.ex. Prov fredag v. 12"
                        Height: =40
                  - conNyLValdaRubrik:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        LayoutGap: =8
                        Fill: =RGBA(0, 0, 0, 0)
                        DropShadow: =DropShadow.None
                        Height: =40
                      Children:
                        - txtValda:
                            Control: ModernText@1.0.0
                            Properties:
                              Text: ="Valda glosor (" & CountRows(colValda) & ")"
                              Size: =14
                              FontColor: =Tema.Brodtext
                              Height: =30
                              FontWeight: =FontWeight.Semibold
                              FillPortions: =1
                        - btnTomLista:
                            Control: ModernButton@1.0.0
                            Properties:
                              Text: ="Töm"
                              OnSelect: =Clear(colValda)
                              Appearance: =ButtonAppearance.Secondary
                              BasePaletteColor: =Tema.Primar
                              Height: =40
                              Width: =90
                  - galValda:
                      Control: Gallery@2.15.0
                      Variant: BrowseLayout_Vertical_TwoTextOneImageVariant_ver5.0
                      Properties:
                        Items: =colValda
                        TemplateSize: =44
                        TemplatePadding: =0
                        FillPortions: =1
                        LayoutMinHeight: =160
                        Fill: =RGBA(0, 0, 0, 0)
                        BorderThickness: =0
                        ShowScrollbar: =true
                      Children:
                        - txtVMal:
                            Control: ModernText@1.0.0
                            Properties:
                              Text: =ThisItem.Title
                              Size: =12
                              FontColor: =Switch(ThisItem.Genus, "f", Tema.GenusF, "m", Tema.GenusM, "n", Tema.GenusN, Tema.Brodtext)
                              Height: =28
                              FontWeight: =FontWeight.Semibold
                              X: =8
                              Y: =8
                              Width: =(Parent.TemplateWidth - 60) / 2
                        - txtVSv:
                            Control: ModernText@1.0.0
                            Properties:
                              Text: =ThisItem.Svenska
                              Size: =12
                              FontColor: =Tema.Brodtext
                              Height: =28
                              X: =12 + (Parent.TemplateWidth - 60) / 2
                              Y: =8
                              Width: =(Parent.TemplateWidth - 60) / 2
                        - btnVTaBort:
                            Control: ModernButton@1.0.0
                            Properties:
                              Text: ="✕"
                              OnSelect: =RemoveIf(colValda, ID = ThisItem.ID)
                              Appearance: =ButtonAppearance.Subtle
                              BasePaletteColor: =Tema.Primar
                              Height: =36
                              X: =Parent.TemplateWidth - 42
                              Y: =4
                              Width: =38
                        - rectVLinje:
                            Control: Rectangle@2.3.0
                            Properties:
                              X: =0
                              Y: =Parent.TemplateHeight - 1
                              Width: =Parent.TemplateWidth
                              Height: =1
                              Fill: =Tema.Linje
                  - btnSparaLista:
                      Control: ModernButton@1.0.0
                      Properties:
                        Text: =If(IsBlank(varRedigeraLista), "Spara gloslista", "Spara ändringar")
                        OnSelect: |-
                          =If(
                              IsBlank(varRedigeraLista),
                              Set(
                                  varSparadLista,
                                  Patch(
                                      glosor_gloslistor,
                                      Defaults(glosor_gloslistor),
                                      {
                                          Title: Trim(txtListNamn.Value),
                                          Beskrivning: txtListBeskr.Value,
                                          Sprak: First(colValda).Sprak,
                                          LarareNamn: User().FullName,
                                          LarareEpost: User().Email,
                                          GlosaIDs: Concat(colValda, Text(ID), ";"),
                                          Aktiv: true
                                      }
                                  )
                              ),
                              Set(
                                  varSparadLista,
                                  Patch(
                                      glosor_gloslistor,
                                      LookUp(glosor_gloslistor, ID = varRedigeraLista.ID),
                                      {
                                          Title: Trim(txtListNamn.Value),
                                          Beskrivning: txtListBeskr.Value,
                                          Sprak: First(colValda).Sprak,
                                          GlosaIDs: Concat(colValda, Text(ID), ";")
                                      }
                                  )
                              )
                          );
                          If(
                              IsEmpty(Errors(glosor_gloslistor)),
                              Set(varRedigeraLista, varSparadLista);
                              Notify("Gloslistan sparades. Kopiera länken och dela med eleverna.", NotificationType.Success),
                              Notify("Något gick fel: " & First(Errors(glosor_gloslistor)).Message, NotificationType.Error)
                          )
                        Appearance: =ButtonAppearance.Primary
                        BasePaletteColor: =Tema.Primar
                        Height: =48
                        DisplayMode: =If(CountRows(colValda) > 0 && !IsBlank(Trim(txtListNamn.Value)), DisplayMode.Edit, DisplayMode.Disabled)
                  - conNyLLank:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        LayoutDirection: =LayoutDirection.Horizontal
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        LayoutGap: =8
                        Fill: =RGBA(0, 0, 0, 0)
                        DropShadow: =DropShadow.None
                        Height: =40
                        Visible: =!IsBlank(varSparadLista)
                      Children:
                        - txtLank:
                            Control: ModernText@1.0.0
                            Properties:
                              Text: |-
                                ="Länk till eleverna: " & WebbAdress & "?lista=" & varSparadLista.ID
                              Size: =12
                              FontColor: =Tema.Primar
                              Height: =40
                              FillPortions: =1
                        - btnKopieraLank:
                            Control: ModernButton@1.0.0
                            Properties:
                              Text: ="Kopiera länk"
                              OnSelect: |-
                                =Copy(WebbAdress & "?lista=" & varSparadLista.ID);
                                Notify("Länken är kopierad.", NotificationType.Success)
                              Appearance: =ButtonAppearance.Secondary
                              BasePaletteColor: =Tema.Primar
                              Height: =40
                              Width: =140
