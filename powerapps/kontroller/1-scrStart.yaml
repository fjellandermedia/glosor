- conStart:
    Control: GroupContainer@1.5.0
    Variant: AutoLayout
    Properties:
      LayoutDirection: =LayoutDirection.Vertical
      LayoutAlignItems: =LayoutAlignItems.Stretch
      LayoutGap: =0
      Fill: =Tema.Bakgrund
      DropShadow: =DropShadow.None
      X: =0
      Y: =0
      Width: =Parent.Width
      Height: =Parent.Height
    Children:
      - conStartHuvud:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            LayoutDirection: =LayoutDirection.Horizontal
            LayoutAlignItems: =LayoutAlignItems.Center
            LayoutGap: =12
            Fill: =Tema.Primar
            DropShadow: =DropShadow.None
            Height: =64
            PaddingLeft: =24
            PaddingRight: =24
          Children:
            - txtStartTitel:
                Control: ModernText@1.0.0
                Properties:
                  Text: ="Glosor – lärarverktyg"
                  Size: =20
                  Color: =Tema.TextPaPrimar
                  Height: =36
                  FontWeight: =FontWeight.Bold
                  FillPortions: =1
      - conStartKropp:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            LayoutDirection: =LayoutDirection.Vertical
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutGap: =16
            Fill: =RGBA(0, 0, 0, 0)
            DropShadow: =DropShadow.None
            FillPortions: =1
            PaddingTop: =24
            PaddingBottom: =16
            PaddingLeft: =32
            PaddingRight: =32
          Children:
            - txtStartHej:
                Control: ModernText@1.0.0
                Properties:
                  Text: ="Hej " & User().FullName & "! Vad vill du göra?"
                  Size: =16
                  Color: =Tema.Brodtext
                  Height: =40
            - conStartKort:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutGap: =16
                  Fill: =RGBA(0, 0, 0, 0)
                  DropShadow: =DropShadow.None
                  Height: =240
                Children:
                  - conStartGlosor:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        LayoutGap: =8
                        Fill: =Tema.Yta
                        DropShadow: =DropShadow.None
                        BorderColor: =Tema.Linje
                        BorderThickness: =1
                        RadiusTopLeft: =12
                        RadiusTopRight: =12
                        RadiusBottomLeft: =12
                        RadiusBottomRight: =12
                        PaddingTop: =16
                        PaddingBottom: =16
                        PaddingLeft: =16
                        PaddingRight: =16
                        LayoutOverflowY: =LayoutOverflow.Hide
                        FillPortions: =1
                        LayoutMinWidth: =220
                      Children:
                        - txtStartGlosorRubrik:
                            Control: ModernText@1.0.0
                            Properties:
                              Text: ="Lägg in glosor"
                              Size: =18
                              Color: =Tema.Brodtext
                              Height: =36
                              FontWeight: =FontWeight.Bold
                        - txtStartGlosorText:
                            Control: ModernText@1.0.0
                            Properties:
                              Text: ="Skriv in eller klistra in glosor till en bok och ett kapitel. Flera lärare kan fylla på samma kapitel."
                              Size: =12
                              Color: =Tema.TextDampad
                              Height: =28
                              FillPortions: =1
                        - btnStartGlosor:
                            Control: ModernButton@1.0.0
                            Properties:
                              Text: ="Öppna"
                              OnSelect: =Navigate(scrGlosor, ScreenTransition.None)
                              Appearance: =ButtonAppearance.Primary
                              BasePaletteColor: =Tema.Primar
                              Height: =40
                              Width: =150
                              AlignInContainer: =AlignInContainer.Start
                  - conStartNyLista:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        LayoutGap: =8
                        Fill: =Tema.Yta
                        DropShadow: =DropShadow.None
                        BorderColor: =Tema.Linje
                        BorderThickness: =1
                        RadiusTopLeft: =12
                        RadiusTopRight: =12
                        RadiusBottomLeft: =12
                        RadiusBottomRight: =12
                        PaddingTop: =16
                        PaddingBottom: =16
                        PaddingLeft: =16
                        PaddingRight: =16
                        LayoutOverflowY: =LayoutOverflow.Hide
                        FillPortions: =1
                        LayoutMinWidth: =220
                      Children:
                        - txtStartNyListaRubrik:
                            Control: ModernText@1.0.0
                            Properties:
                              Text: ="Skapa gloslista"
                              Size: =18
                              Color: =Tema.Brodtext
                              Height: =36
                              FontWeight: =FontWeight.Bold
                        - txtStartNyListaText:
                            Control: ModernText@1.0.0
                            Properties:
                              Text: ="Välj glosor ur böcker och kapitel, eller slå ihop befintliga listor, och dela listan med eleverna."
                              Size: =12
                              Color: =Tema.TextDampad
                              Height: =28
                              FillPortions: =1
                        - btnStartNyLista:
                            Control: ModernButton@1.0.0
                            Properties:
                              Text: ="Öppna"
                              OnSelect: |-
                                =Set(varRedigeraLista, Blank());
                                Set(varMallNamn, "");
                                Clear(colValda);
                                Navigate(scrNyLista, ScreenTransition.None)
                              Appearance: =ButtonAppearance.Primary
                              BasePaletteColor: =Tema.Primar
                              Height: =40
                              Width: =150
                              AlignInContainer: =AlignInContainer.Start
                  - conStartListor:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        LayoutGap: =8
                        Fill: =Tema.Yta
                        DropShadow: =DropShadow.None
                        BorderColor: =Tema.Linje
                        BorderThickness: =1
                        RadiusTopLeft: =12
                        RadiusTopRight: =12
                        RadiusBottomLeft: =12
                        RadiusBottomRight: =12
                        PaddingTop: =16
                        PaddingBottom: =16
                        PaddingLeft: =16
                        PaddingRight: =16
                        LayoutOverflowY: =LayoutOverflow.Hide
                        FillPortions: =1
                        LayoutMinWidth: =220
                      Children:
                        - txtStartListorRubrik:
                            Control: ModernText@1.0.0
                            Properties:
                              Text: ="Gloslistor"
                              Size: =18
                              Color: =Tema.Brodtext
                              Height: =36
                              FontWeight: =FontWeight.Bold
                        - txtStartListorText:
                            Control: ModernText@1.0.0
                            Properties:
                              Text: ="Se dina och andras gloslistor, kopiera länkar till eleverna, redigera eller dölj listor."
                              Size: =12
                              Color: =Tema.TextDampad
                              Height: =28
                              FillPortions: =1
                        - btnStartListor:
                            Control: ModernButton@1.0.0
                            Properties:
                              Text: ="Öppna"
                              OnSelect: =Navigate(scrListor, ScreenTransition.None)
                              Appearance: =ButtonAppearance.Primary
                              BasePaletteColor: =Tema.Primar
                              Height: =40
                              Width: =150
                              AlignInContainer: =AlignInContainer.Start
            - txtStartWebb:
                Control: ModernText@1.0.0
                Properties:
                  Text: |-
                    ="Elevernas övningssida: " & WebbAdress
                  Size: =10
                  Color: =Tema.TextDampad
                  Height: =22
