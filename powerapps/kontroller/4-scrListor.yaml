- conLis:
    Control: GroupContainer@1.5.0
    Variant: AutoLayout
    Properties:
      LayoutDirection: =LayoutDirection.Vertical
      LayoutAlignItems: =LayoutAlignItems.Stretch
      LayoutGap: =0
      Fill: =Tema.Bakgrund
      DropShadow: =DropShadow.None
      X: =0
      Y: =0
      Width: =Parent.Width
      Height: =Parent.Height
    Children:
      - conLisHuvud:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            LayoutDirection: =LayoutDirection.Horizontal
            LayoutAlignItems: =LayoutAlignItems.Center
            LayoutGap: =12
            Fill: =Tema.Primar
            DropShadow: =DropShadow.None
            Height: =64
            PaddingLeft: =24
            PaddingRight: =24
          Children:
            - txtLisTitel:
                Control: ModernText@1.0.0
                Properties:
                  Text: ="Gloslistor"
                  Size: =20
                  FontColor: =Tema.TextPaPrimar
                  Height: =36
                  FontWeight: =FontWeight.Bold
                  FillPortions: =1
            - btnLisHem:
                Control: ModernButton@1.0.0
                Properties:
                  Text: ="Start"
                  OnSelect: =Navigate(scrStart, ScreenTransition.None)
                  Appearance: =ButtonAppearance.Secondary
                  BasePaletteColor: =Tema.Primar
                  Height: =40
                  Width: =120
      - conLisKropp:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            LayoutDirection: =LayoutDirection.Vertical
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutGap: =16
            Fill: =RGBA(0, 0, 0, 0)
            DropShadow: =DropShadow.None
            FillPortions: =1
            PaddingTop: =16
            PaddingBottom: =16
            PaddingLeft: =16
            PaddingRight: =16
          Children:
            - conLisVerktyg:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutGap: =8
                  Fill: =RGBA(0, 0, 0, 0)
                  DropShadow: =DropShadow.None
                  Height: =40
                Children:
                  - chkAllaListor:
                      Control: ModernCheckbox@1.0.2
                      Properties:
                        Label: ="Visa alla lärares listor"
                        Height: =36
                        FillPortions: =1
                  - btnLisNy:
                      Control: ModernButton@1.0.0
                      Properties:
                        Text: ="+ Ny gloslista"
                        OnSelect: |-
                          =Set(varRedigeraLista, Blank());
                          Set(varMallNamn, "");
                          Clear(colValda);
                          Navigate(scrNyLista, ScreenTransition.None)
                        Appearance: =ButtonAppearance.Primary
                        BasePaletteColor: =Tema.Primar
                        Height: =40
                        Width: =180
            - conLisLista:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  LayoutDirection: =LayoutDirection.Vertical
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutGap: =8
                  Fill: =Tema.Yta
                  DropShadow: =DropShadow.None
                  BorderColor: =Tema.Linje
                  BorderThickness: =1
                  RadiusTopLeft: =12
                  RadiusTopRight: =12
                  RadiusBottomLeft: =12
                  RadiusBottomRight: =12
                  PaddingTop: =4
                  PaddingBottom: =4
                  PaddingLeft: =16
                  PaddingRight: =16
                  LayoutOverflowY: =LayoutOverflow.Scroll
                  FillPortions: =1
                Children:
                  - galListor:
                      Control: Gallery@2.15.0
                      Variant: BrowseLayout_Vertical_TwoTextOneImageVariant_ver5.0
                      Properties:
                        Items: |-
                          =Sort(
                              If(chkAllaListor.Checked, glosor_gloslistor, Filter(glosor_gloslistor, LarareEpost = User().Email)),
                              ID,
                              SortOrder.Descending
                          )
                        TemplateSize: =92
                        TemplatePadding: =0
                        FillPortions: =1
                        LayoutMinHeight: =160
                        Fill: =RGBA(0, 0, 0, 0)
                        BorderThickness: =0
                        ShowScrollbar: =true
                      Children:
                        - txtLTitel:
                            Control: ModernText@1.0.0
                            Properties:
                              Text: =ThisItem.Title
                              Size: =14
                              FontColor: =If(ThisItem.Aktiv, Tema.Brodtext, Tema.TextDampad)
                              Height: =30
                              FontWeight: =FontWeight.Bold
                              X: =16
                              Y: =10
                              Width: =Max(200, Parent.TemplateWidth - 720)
                        - txtLMeta:
                            Control: ModernText@1.0.0
                            Properties:
                              Text: =ThisItem.LarareNamn & " · " & CountRows(Filter(Split(ThisItem.GlosaIDs, ";"), !IsBlank(Trim(Value)))) & " glosor · " & Coalesce(LookUp(Sprakval, Kod = ThisItem.Sprak).Namn, ThisItem.Sprak) & If(ThisItem.Aktiv, "", " · DOLD för eleverna") & If(IsBlank(ThisItem.Beskrivning), "", " · " & ThisItem.Beskrivning)
                              Size: =11
                              FontColor: =Tema.TextDampad
                              Height: =24
                              X: =16
                              Y: =40
                              Width: =Max(200, Parent.TemplateWidth - 720)
                        - txtLLank:
                            Control: ModernText@1.0.0
                            Properties:
                              Text: =WebbAdress & "?lista=" & ThisItem.ID
                              Size: =10
                              FontColor: =Tema.Primar
                              Height: =22
                              X: =16
                              Y: =64
                              Width: =Max(200, Parent.TemplateWidth - 720)
                        - btnLKopiera:
                            Control: ModernButton@1.0.0
                            Properties:
                              Text: ="Kopiera länk"
                              OnSelect: |-
                                =Copy(WebbAdress & "?lista=" & ThisItem.ID);
                                Notify("Länken är kopierad.", NotificationType.Success)
                              Appearance: =ButtonAppearance.Secondary
                              BasePaletteColor: =Tema.Primar
                              Height: =40
                              X: =Parent.TemplateWidth - 690
                              Y: =26
                              Width: =125
                        - btnLRedigera:
                            Control: ModernButton@1.0.0
                            Properties:
                              Text: ="Redigera"
                              OnSelect: |-
                                =Clear(colValda);
                                ForAll(
                                    Split(ThisItem.GlosaIDs, ";") As idText,
                                    If(
                                        !IsBlank(Trim(idText.Value)) && IsBlank(LookUp(colValda, ID = Value(idText.Value))),
                                        With(
                                            { g: LookUp(glosor_glosor, ID = Value(idText.Value)) },
                                            If(!IsBlank(g.ID), Collect(colValda, { ID: g.ID, Title: g.Title, Svenska: g.Svenska, Genus: g.Genus, Sprak: g.Sprak }))
                                        )
                                    )
                                );
                                Set(varRedigeraLista, ThisItem);
                                Navigate(scrNyLista, ScreenTransition.None)
                              Appearance: =ButtonAppearance.Secondary
                              BasePaletteColor: =Tema.Primar
                              Height: =40
                              Visible: =ThisItem.LarareEpost = User().Email
                              X: =Parent.TemplateWidth - 555
                              Y: =26
                              Width: =105
                        - btnLMall:
                            Control: ModernButton@1.0.0
                            Properties:
                              Text: ="Använd som mall"
                              OnSelect: |-
                                =Clear(colValda);
                                ForAll(
                                    Split(ThisItem.GlosaIDs, ";") As idText,
                                    If(
                                        !IsBlank(Trim(idText.Value)) && IsBlank(LookUp(colValda, ID = Value(idText.Value))),
                                        With(
                                            { g: LookUp(glosor_glosor, ID = Value(idText.Value)) },
                                            If(!IsBlank(g.ID), Collect(colValda, { ID: g.ID, Title: g.Title, Svenska: g.Svenska, Genus: g.Genus, Sprak: g.Sprak }))
                                        )
                                    )
                                );
                                Set(varRedigeraLista, Blank());
                                Set(varMallNamn, "Kopia av " & ThisItem.Title);
                                Navigate(scrNyLista, ScreenTransition.None)
                              Appearance: =ButtonAppearance.Secondary
                              BasePaletteColor: =Tema.Primar
                              Height: =40
                              X: =Parent.TemplateWidth - 440
                              Y: =26
                              Width: =140
                        - btnLAktiv:
                            Control: ModernButton@1.0.0
                            Properties:
                              Text: =If(ThisItem.Aktiv, "Dölj", "Visa")
                              OnSelect: |-
                                =Patch(glosor_gloslistor, ThisItem, { Aktiv: !ThisItem.Aktiv })
                              Appearance: =ButtonAppearance.Secondary
                              BasePaletteColor: =Tema.Primar
                              Height: =40
                              Visible: =ThisItem.LarareEpost = User().Email
                              X: =Parent.TemplateWidth - 290
                              Y: =26
                              Width: =90
                        - btnLTaBort:
                            Control: ModernButton@1.0.0
                            Properties:
                              Text: =If(varTaBortID = ThisItem.ID, "Bekräfta!", "Ta bort")
                              OnSelect: |-
                                =If(
                                    varTaBortID = ThisItem.ID,
                                    Remove(glosor_gloslistor, ThisItem);
                                    Set(varTaBortID, 0),
                                    Set(varTaBortID, ThisItem.ID)
                                )
                              Appearance: =If(varTaBortID = ThisItem.ID, ButtonAppearance.Primary, ButtonAppearance.Secondary)
                              BasePaletteColor: =Tema.Fel
                              Height: =40
                              Visible: =ThisItem.LarareEpost = User().Email
                              X: =Parent.TemplateWidth - 190
                              Y: =26
                              Width: =170
                        - rectLLinje:
                            Control: Rectangle@2.3.0
                            Properties:
                              X: =0
                              Y: =Parent.TemplateHeight - 1
                              Width: =Parent.TemplateWidth
                              Height: =1
                              Fill: =Tema.Linje
