- btnTolka:
    Control: Classic/Button@2.2.0
    Properties:
      Text: ="Lägg till raderna ↓"
      X: =440
      Y: =210
      Width: =220
      Height: =38
      OnSelect: |-
        =With(
            {
                rader: Filter(
                    Split(Substitute(txtImport.Text, Char(13), ""), Char(10)),
                    !IsBlank(Trim(Value))
                ),
                start: Coalesce(Max(colImport, Nr), 0),
                valtSprak: lblGlosSprak.Text
            },
            Collect(
                colImport,
                ForAll(
                    Sequence(CountRows(rader)) As n,
                    With(
                        { rad: Index(rader, n.Value).Value },
                        With(
                            {
                                delar: If(
                                    !IsBlank(Find(Char(9), rad)), Split(rad, Char(9)),
                                    !IsBlank(Find(";", rad)), Split(rad, ";"),
                                    !IsBlank(Find(" - ", rad)), Split(rad, " - "),
                                    !IsBlank(Find(" = ", rad)), Split(rad, " = "),
                                    Split(rad, Char(9))
                                )
                            },
                            With(
                                {
                                    mal: Trim(First(delar).Value),
                                    sv: If(CountRows(delar) > 1, Trim(Last(delar).Value), "")
                                },
                                {
                                    Nr: start + n.Value,
                                    Mal: mal,
                                    Svenska: sv,
                                    Genus: Coalesce(LookUp(GenusArtiklar, Sprak = valtSprak && Artikel = Lower(First(Split(Trim(mal), " ")).Value), Genus), "")
                                }
                            )
                        )
                    )
                )
            )
        );
        Reset(txtImport)
      Fill: =RGBA(47, 91, 211, 1)
      Color: =RGBA(255, 255, 255, 1)
      HoverFill: =ColorFade(Self.Fill, -15%)
      HoverColor: =RGBA(255, 255, 255, 1)
      PressedFill: =ColorFade(Self.Fill, -25%)
      BorderColor: =RGBA(47, 91, 211, 1)
      BorderThickness: =2
      RadiusTopLeft: =8
      RadiusTopRight: =8
      RadiusBottomLeft: =8
      RadiusBottomRight: =8
      Size: =12
      FontWeight: =FontWeight.Semibold
