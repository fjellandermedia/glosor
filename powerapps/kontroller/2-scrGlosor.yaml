- btnSparaGlosor:
    Control: Classic/Button@2.2.0
    Properties:
      Text: ="Spara " & CountRows(colImport) & " glosor"
      X: =440
      Y: =694
      Width: =460
      Height: =48
      OnSelect: |-
        =With(
            {
                bok: Coalesce(cmbBok.Selected.ID, 0),
                kap: Coalesce(cmbKapitel.Selected.ID, 0),
                valtSprak: lblGlosSprak.Text,
                antal: CountRows(colImport)
            },
            Collect(
                Glosor,
                ForAll(
                    colImport As r,
                    {
                        Title: Trim(r.Mal),
                        Svenska: Trim(r.Svenska),
                        Genus: r.Genus,
                        Sprak: valtSprak,
                        BokID: bok,
                        KapitelID: kap,
                        SkapadAv: User().FullName,
                        SkapadAvEpost: User().Email
                    }
                )
            );
            If(
                IsEmpty(Errors(Glosor)),
                Notify(antal & " glosor sparades.", NotificationType.Success);
                Clear(colImport),
                Notify("Något gick fel: " & First(Errors(Glosor)).Message, NotificationType.Error)
            )
        )
      Fill: =RGBA(47, 91, 211, 1)
      Color: =RGBA(255, 255, 255, 1)
      HoverFill: =ColorFade(Self.Fill, -15%)
      HoverColor: =RGBA(255, 255, 255, 1)
      PressedFill: =ColorFade(Self.Fill, -25%)
      BorderColor: =RGBA(47, 91, 211, 1)
      BorderThickness: =2
      RadiusTopLeft: =8
      RadiusTopRight: =8
      RadiusBottomLeft: =8
      RadiusBottomRight: =8
      Size: =12
      FontWeight: =FontWeight.Semibold
      DisplayMode: =If(CountRows(colImport) > 0 && IsBlank(lblImportVarning.Text), DisplayMode.Edit, DisplayMode.Disabled)
