Screens:
  scrStart:
    Properties:
      Fill: =RGBA(244, 246, 251, 1)
    Children:
      - rectStartHuvud:
          Control: Rectangle@2.3.0
          Properties:
            X: =0
            Y: =0
            Width: =Parent.Width
            Height: =64
            Fill: =RGBA(47, 91, 211, 1)
      - lblStartTitel:
          Control: Label@2.5.1
          Properties:
            Text: ="Glosor – lärarverktyg"
            X: =24
            Y: =0
            Width: =800
            Height: =64
            Color: =RGBA(255, 255, 255, 1)
            Size: =20
            FontWeight: =FontWeight.Bold
      - lblStartHej:
          Control: Label@2.5.1
          Properties:
            Text: ="Hej " & User().FullName & "! Vad vill du göra?"
            X: =40
            Y: =100
            Width: =Parent.Width - 80
            Height: =50
            Color: =RGBA(28, 35, 51, 1)
            Size: =16
      - rectStartGlosor:
          Control: Rectangle@2.3.0
          Properties:
            X: =40 + 0 * ((Parent.Width - 120) / 3 + 20)
            Y: =170
            Width: =(Parent.Width - 120) / 3
            Height: =230
            Fill: =RGBA(255, 255, 255, 1)
            BorderColor: =RGBA(221, 226, 236, 1)
            BorderThickness: =1
      - lblStartGlosorRubrik:
          Control: Label@2.5.1
          Properties:
            Text: ="Lägg in glosor"
            X: =40 + 0 * ((Parent.Width - 120) / 3 + 20) + 24
            Y: =190
            Width: =(Parent.Width - 120) / 3 - 48
            Height: =40
            Color: =RGBA(28, 35, 51, 1)
            Size: =18
            FontWeight: =FontWeight.Bold
      - lblStartGlosorText:
          Control: Label@2.5.1
          Properties:
            Text: ="Skriv in eller klistra in glosor till en bok och ett kapitel. Flera lärare kan fylla på samma kapitel."
            X: =40 + 0 * ((Parent.Width - 120) / 3 + 20) + 24
            Y: =235
            Width: =(Parent.Width - 120) / 3 - 48
            Height: =90
            Color: =RGBA(91, 101, 120, 1)
            Size: =12
            VerticalAlign: =VerticalAlign.Top
      - btnStartGlosor:
          Control: Classic/Button@2.2.0
          Properties:
            Text: ="Öppna"
            X: =40 + 0 * ((Parent.Width - 120) / 3 + 20) + 24
            Y: =335
            Width: =150
            Height: =44
            OnSelect: =Navigate(scrGlosor, ScreenTransition.None)
            Fill: =RGBA(47, 91, 211, 1)
            Color: =RGBA(255, 255, 255, 1)
            HoverFill: =ColorFade(Self.Fill, -15%)
            HoverColor: =RGBA(255, 255, 255, 1)
            PressedFill: =ColorFade(Self.Fill, -25%)
            BorderColor: =RGBA(47, 91, 211, 1)
            BorderThickness: =2
            RadiusTopLeft: =8
            RadiusTopRight: =8
            RadiusBottomLeft: =8
            RadiusBottomRight: =8
            Size: =12
            FontWeight: =FontWeight.Semibold
      - rectStartNyLista:
          Control: Rectangle@2.3.0
          Properties:
            X: =40 + 1 * ((Parent.Width - 120) / 3 + 20)
            Y: =170
            Width: =(Parent.Width - 120) / 3
            Height: =230
            Fill: =RGBA(255, 255, 255, 1)
            BorderColor: =RGBA(221, 226, 236, 1)
            BorderThickness: =1
      - lblStartNyListaRubrik:
          Control: Label@2.5.1
          Properties:
            Text: ="Skapa gloslista"
            X: =40 + 1 * ((Parent.Width - 120) / 3 + 20) + 24
            Y: =190
            Width: =(Parent.Width - 120) / 3 - 48
            Height: =40
            Color: =RGBA(28, 35, 51, 1)
            Size: =18
            FontWeight: =FontWeight.Bold
      - lblStartNyListaText:
          Control: Label@2.5.1
          Properties:
            Text: ="Välj glosor ur böcker och kapitel, eller slå ihop befintliga listor, och dela listan med eleverna."
            X: =40 + 1 * ((Parent.Width - 120) / 3 + 20) + 24
            Y: =235
            Width: =(Parent.Width - 120) / 3 - 48
            Height: =90
            Color: =RGBA(91, 101, 120, 1)
            Size: =12
            VerticalAlign: =VerticalAlign.Top
      - btnStartNyLista:
          Control: Classic/Button@2.2.0
          Properties:
            Text: ="Öppna"
            X: =40 + 1 * ((Parent.Width - 120) / 3 + 20) + 24
            Y: =335
            Width: =150
            Height: =44
            OnSelect: |-
              =Set(varRedigeraLista, Blank());
              Set(varMallNamn, "");
              Clear(colValda);
              Navigate(scrNyLista, ScreenTransition.None)
            Fill: =RGBA(47, 91, 211, 1)
            Color: =RGBA(255, 255, 255, 1)
            HoverFill: =ColorFade(Self.Fill, -15%)
            HoverColor: =RGBA(255, 255, 255, 1)
            PressedFill: =ColorFade(Self.Fill, -25%)
            BorderColor: =RGBA(47, 91, 211, 1)
            BorderThickness: =2
            RadiusTopLeft: =8
            RadiusTopRight: =8
            RadiusBottomLeft: =8
            RadiusBottomRight: =8
            Size: =12
            FontWeight: =FontWeight.Semibold
      - rectStartListor:
          Control: Rectangle@2.3.0
          Properties:
            X: =40 + 2 * ((Parent.Width - 120) / 3 + 20)
            Y: =170
            Width: =(Parent.Width - 120) / 3
            Height: =230
            Fill: =RGBA(255, 255, 255, 1)
            BorderColor: =RGBA(221, 226, 236, 1)
            BorderThickness: =1
      - lblStartListorRubrik:
          Control: Label@2.5.1
          Properties:
            Text: ="Gloslistor"
            X: =40 + 2 * ((Parent.Width - 120) / 3 + 20) + 24
            Y: =190
            Width: =(Parent.Width - 120) / 3 - 48
            Height: =40
            Color: =RGBA(28, 35, 51, 1)
            Size: =18
            FontWeight: =FontWeight.Bold
      - lblStartListorText:
          Control: Label@2.5.1
          Properties:
            Text: ="Se dina och andras gloslistor, kopiera länkar till eleverna, redigera eller dölj listor."
            X: =40 + 2 * ((Parent.Width - 120) / 3 + 20) + 24
            Y: =235
            Width: =(Parent.Width - 120) / 3 - 48
            Height: =90
            Color: =RGBA(91, 101, 120, 1)
            Size: =12
            VerticalAlign: =VerticalAlign.Top
      - btnStartListor:
          Control: Classic/Button@2.2.0
          Properties:
            Text: ="Öppna"
            X: =40 + 2 * ((Parent.Width - 120) / 3 + 20) + 24
            Y: =335
            Width: =150
            Height: =44
            OnSelect: =Navigate(scrListor, ScreenTransition.None)
            Fill: =RGBA(47, 91, 211, 1)
            Color: =RGBA(255, 255, 255, 1)
            HoverFill: =ColorFade(Self.Fill, -15%)
            HoverColor: =RGBA(255, 255, 255, 1)
            PressedFill: =ColorFade(Self.Fill, -25%)
            BorderColor: =RGBA(47, 91, 211, 1)
            BorderThickness: =2
            RadiusTopLeft: =8
            RadiusTopRight: =8
            RadiusBottomLeft: =8
            RadiusBottomRight: =8
            Size: =12
            FontWeight: =FontWeight.Semibold
      - lblStartWebb:
          Control: Label@2.5.1
          Properties:
            Text: |-
              ="Elevernas övningssida: " & WebbAdress
            X: =40
            Y: =430
            Width: =Parent.Width - 80
            Height: =30
            Color: =RGBA(91, 101, 120, 1)
            Size: =11
