Screens:
  scrGlosor:
    Properties:
      Fill: =Tema.Bakgrund
    Children:
      - conGlos:
          Control: GroupContainer@1.5.0
          Variant: AutoLayout
          Properties:
            LayoutDirection: =LayoutDirection.Vertical
            LayoutAlignItems: =LayoutAlignItems.Stretch
            LayoutGap: =0
            Fill: =Tema.Bakgrund
            DropShadow: =DropShadow.None
            X: =0
            Y: =0
            Width: =Parent.Width
            Height: =Parent.Height
          Children:
            - conGlosHuvud:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutAlignItems: =LayoutAlignItems.Center
                  LayoutGap: =12
                  Fill: =Tema.Primar
                  DropShadow: =DropShadow.None
                  Height: =64
                  PaddingLeft: =24
                  PaddingRight: =24
                Children:
                  - txtGlosTitel:
                      Control: ModernText@1.0.0
                      Properties:
                        Text: ="Lägg in glosor"
                        Size: =20
                        Color: =Tema.TextPaPrimar
                        Height: =36
                        FontWeight: =FontWeight.Bold
                        FillPortions: =1
                  - btnGlosHem:
                      Control: ModernButton@1.0.0
                      Properties:
                        Text: ="Start"
                        OnSelect: =Navigate(scrStart, ScreenTransition.None)
                        Appearance: =ButtonAppearance.Secondary
                        BasePaletteColor: =Tema.Primar
                        Height: =40
                        Width: =120
            - conGlosKropp:
                Control: GroupContainer@1.5.0
                Variant: AutoLayout
                Properties:
                  LayoutDirection: =LayoutDirection.Horizontal
                  LayoutAlignItems: =LayoutAlignItems.Stretch
                  LayoutGap: =16
                  Fill: =RGBA(0, 0, 0, 0)
                  DropShadow: =DropShadow.None
                  FillPortions: =1
                  PaddingTop: =16
                  PaddingBottom: =16
                  PaddingLeft: =16
                  PaddingRight: =16
                Children:
                  - conGlosVal:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        LayoutGap: =8
                        Fill: =Tema.Yta
                        DropShadow: =DropShadow.None
                        BorderColor: =Tema.Linje
                        BorderThickness: =1
                        RadiusTopLeft: =12
                        RadiusTopRight: =12
                        RadiusBottomLeft: =12
                        RadiusBottomRight: =12
                        PaddingTop: =16
                        PaddingBottom: =16
                        PaddingLeft: =16
                        PaddingRight: =16
                        LayoutOverflowY: =LayoutOverflow.Scroll
                        FillPortions: =3
                        LayoutMinWidth: =300
                      Children:
                        - txtGlosSprak:
                            Control: ModernText@1.0.0
                            Properties:
                              Text: =If(IsBlank(cmbBok.Selected.ID), cmbSprak.Selected.Kod, cmbBok.Selected.Sprak)
                              Size: =12
                              Color: =Tema.Brodtext
                              Height: =28
                              Visible: =false
                        - txtBok:
                            Control: ModernText@1.0.0
                            Properties:
                              Text: ="1. Bok"
                              Size: =14
                              Color: =Tema.Brodtext
                              Height: =30
                              FontWeight: =FontWeight.Semibold
                        - cmbBok:
                            Control: ModernCombobox@1.1.2
                            Properties:
                              Items: =Sort(glosor_bocker, Title)
                              ItemDisplayText: =ThisItem.Title
                              SelectMultiple: =false
                              InputTextPlaceholder: ="Välj bok – tomt = fristående glosor"
                              Height: =40
                              DefaultSelectedItems: =Filter(glosor_bocker, ID = varBokID)
                              OnChange: |-
                                =Set(varKapitelID, 0);
                                Reset(cmbKapitel)
                        - conNyBok:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              LayoutDirection: =LayoutDirection.Horizontal
                              LayoutAlignItems: =LayoutAlignItems.Stretch
                              LayoutGap: =8
                              Fill: =RGBA(0, 0, 0, 0)
                              DropShadow: =DropShadow.None
                              Height: =40
                            Children:
                              - txtNyBok:
                                  Control: ModernTextInput@1.1.2
                                  Properties:
                                    Default: =""
                                    Placeholder: ="Ny bok…"
                                    Height: =40
                                    FillPortions: =2
                              - cmbNyBokSprak:
                                  Control: ModernCombobox@1.1.2
                                  Properties:
                                    Items: =Sprakval
                                    ItemDisplayText: =ThisItem.Namn
                                    SelectMultiple: =false
                                    InputTextPlaceholder: ="Språk"
                                    Height: =40
                                    FillPortions: =1
                                    LayoutMinWidth: =110
                              - btnNyBok:
                                  Control: ModernButton@1.0.0
                                  Properties:
                                    Text: ="Skapa bok"
                                    OnSelect: |-
                                      =If(
                                          !IsBlank(Trim(txtNyBok.Text)) && !IsBlank(cmbNyBokSprak.Selected.Kod),
                                          Set(
                                              varBokID,
                                              Patch(glosor_bocker, Defaults(glosor_bocker), { Title: Trim(txtNyBok.Text), Sprak: cmbNyBokSprak.Selected.Kod }).ID
                                          );
                                          Set(varKapitelID, 0);
                                          Reset(txtNyBok);
                                          Reset(cmbNyBokSprak);
                                          Reset(cmbBok);
                                          Reset(cmbKapitel),
                                          Notify("Skriv bokens namn och välj språk.", NotificationType.Warning)
                                      )
                                    Appearance: =ButtonAppearance.Secondary
                                    BasePaletteColor: =Tema.Primar
                                    Height: =40
                                    Width: =110
                        - txtBokSprak:
                            Control: ModernText@1.0.0
                            Properties:
                              Text: |-
                                ="Språk: " & Coalesce(LookUp(Sprakval, Kod = cmbBok.Selected.Sprak).Namn, cmbBok.Selected.Sprak)
                              Size: =10
                              Color: =Tema.TextDampad
                              Height: =22
                              Visible: =!IsBlank(cmbBok.Selected.ID)
                        - txtKapitel:
                            Control: ModernText@1.0.0
                            Properties:
                              Text: ="2. Kapitel"
                              Size: =14
                              Color: =Tema.Brodtext
                              Height: =30
                              FontWeight: =FontWeight.Semibold
                        - cmbKapitel:
                            Control: ModernCombobox@1.1.2
                            Properties:
                              Items: =Sort(Filter(glosor_kapitel, BokID = Coalesce(cmbBok.Selected.ID, -1)), Ordning)
                              ItemDisplayText: =ThisItem.Title
                              SelectMultiple: =false
                              InputTextPlaceholder: ="Välj kapitel"
                              Height: =40
                              DefaultSelectedItems: =Filter(glosor_kapitel, ID = varKapitelID)
                              DisplayMode: =If(IsBlank(cmbBok.Selected.ID), DisplayMode.Disabled, DisplayMode.Edit)
                        - conNyttKapitel:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              LayoutDirection: =LayoutDirection.Horizontal
                              LayoutAlignItems: =LayoutAlignItems.Stretch
                              LayoutGap: =8
                              Fill: =RGBA(0, 0, 0, 0)
                              DropShadow: =DropShadow.None
                              Height: =40
                            Children:
                              - txtNyttKapitel:
                                  Control: ModernTextInput@1.1.2
                                  Properties:
                                    Default: =""
                                    Placeholder: ="Nytt kapitel…"
                                    Height: =40
                                    FillPortions: =1
                                    DisplayMode: =If(IsBlank(cmbBok.Selected.ID), DisplayMode.Disabled, DisplayMode.Edit)
                              - btnNyttKapitel:
                                  Control: ModernButton@1.0.0
                                  Properties:
                                    Text: ="Skapa kapitel"
                                    OnSelect: |-
                                      =If(
                                          !IsBlank(Trim(txtNyttKapitel.Text)) && !IsBlank(cmbBok.Selected.ID),
                                          Set(
                                              varKapitelID,
                                              Patch(
                                                  glosor_kapitel,
                                                  Defaults(glosor_kapitel),
                                                  {
                                                      Title: Trim(txtNyttKapitel.Text),
                                                      BokID: cmbBok.Selected.ID,
                                                      Ordning: Coalesce(
                                                          First(Sort(Filter(glosor_kapitel, BokID = cmbBok.Selected.ID), Ordning, SortOrder.Descending)).Ordning,
                                                          0
                                                      ) + 1
                                                  }
                                              ).ID
                                          );
                                          Reset(txtNyttKapitel);
                                          Reset(cmbKapitel),
                                          Notify("Välj bok och skriv kapitlets namn.", NotificationType.Warning)
                                      )
                                    Appearance: =ButtonAppearance.Secondary
                                    BasePaletteColor: =Tema.Primar
                                    Height: =40
                                    Width: =130
                                    DisplayMode: =If(IsBlank(cmbBok.Selected.ID), DisplayMode.Disabled, DisplayMode.Edit)
                        - txtSprak:
                            Control: ModernText@1.0.0
                            Properties:
                              Text: ="Språk för fristående glosor"
                              Size: =14
                              Color: =Tema.Brodtext
                              Height: =30
                              FontWeight: =FontWeight.Semibold
                              Visible: =IsBlank(cmbBok.Selected.ID)
                        - cmbSprak:
                            Control: ModernCombobox@1.1.2
                            Properties:
                              Items: =Sprakval
                              ItemDisplayText: =ThisItem.Namn
                              SelectMultiple: =false
                              InputTextPlaceholder: ="Välj språk"
                              Height: =40
                              Visible: =IsBlank(cmbBok.Selected.ID)
                        - conTips:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              LayoutDirection: =LayoutDirection.Vertical
                              LayoutAlignItems: =LayoutAlignItems.Stretch
                              LayoutGap: =8
                              Fill: =Tema.PrimarLjus
                              DropShadow: =DropShadow.None
                              Height: =300
                              PaddingTop: =12
                              PaddingBottom: =12
                              PaddingLeft: =14
                              PaddingRight: =14
                              RadiusTopLeft: =8
                              RadiusTopRight: =8
                              RadiusBottomLeft: =8
                              RadiusBottomRight: =8
                            Children:
                              - txtTips:
                                  Control: ModernText@1.0.0
                                  Properties:
                                    Text: |-
                                      ="Tips när du skriver glosor

                                      • Skriv grundform om inget annat ska tränas.
                                      • Använd versal i början bara om ordet alltid skrivs så (der Hund).
                                      • Skriv gärna artikel på substantiv: la casa, der Hund, das Haus – inte bara casa, Hund, Haus.
                                      • Färgmarkera genus med knappen efter ordet: röd = femininum, blå = maskulinum, grön = neutrum. Appen föreslår färg utifrån artikeln.
                                      • Flera godkända svar: skriv / mellan (la casa / el hogar). Valfri del inom parentes: (se) llamar."
                                    Size: =11
                                    Color: =Tema.Brodtext
                                    Height: =28
                                    FillPortions: =1
                  - conGlosImport:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        LayoutGap: =8
                        Fill: =Tema.Yta
                        DropShadow: =DropShadow.None
                        BorderColor: =Tema.Linje
                        BorderThickness: =1
                        RadiusTopLeft: =12
                        RadiusTopRight: =12
                        RadiusBottomLeft: =12
                        RadiusBottomRight: =12
                        PaddingTop: =16
                        PaddingBottom: =16
                        PaddingLeft: =16
                        PaddingRight: =16
                        LayoutOverflowY: =LayoutOverflow.Scroll
                        FillPortions: =4
                        LayoutMinWidth: =380
                      Children:
                        - txtImportRubrik:
                            Control: ModernText@1.0.0
                            Properties:
                              Text: ="3. Klistra in glosor – en per rad, tabb mellan orden"
                              Size: =14
                              Color: =Tema.Brodtext
                              Height: =30
                              FontWeight: =FontWeight.Semibold
                        - txtImport:
                            Control: ModernTextInput@1.1.2
                            Properties:
                              Default: =""
                              Placeholder: ="house ⇥ hus (tabb, ; eller - mellan orden)"
                              Height: =100
                              Type: =TextInputType.Multiline
                        - conImportKnappar:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              LayoutDirection: =LayoutDirection.Horizontal
                              LayoutAlignItems: =LayoutAlignItems.Stretch
                              LayoutGap: =8
                              Fill: =RGBA(0, 0, 0, 0)
                              DropShadow: =DropShadow.None
                              Height: =40
                            Children:
                              - btnTolka:
                                  Control: ModernButton@1.0.0
                                  Properties:
                                    Text: ="Lägg till raderna ↓"
                                    OnSelect: |-
                                      =With(
                                          {
                                              rader: Filter(
                                                  Split(Substitute(txtImport.Text, Char(13), ""), Char(10)),
                                                  !IsBlank(Trim(Value))
                                              ),
                                              start: Coalesce(Max(colImport, Nr), 0),
                                              valtSprak: txtGlosSprak.Text
                                          },
                                          Collect(
                                              colImport,
                                              ForAll(
                                                  Sequence(CountRows(rader)) As n,
                                                  With(
                                                      { rad: Index(rader, n.Value).Value },
                                                      With(
                                                          {
                                                              delar: If(
                                                                  !IsBlank(Find(Char(9), rad)), Split(rad, Char(9)),
                                                                  !IsBlank(Find(";", rad)), Split(rad, ";"),
                                                                  !IsBlank(Find(" - ", rad)), Split(rad, " - "),
                                                                  !IsBlank(Find(" = ", rad)), Split(rad, " = "),
                                                                  Split(rad, Char(9))
                                                              )
                                                          },
                                                          With(
                                                              {
                                                                  mal: Trim(First(delar).Value),
                                                                  sv: If(CountRows(delar) > 1, Trim(Last(delar).Value), "")
                                                              },
                                                              {
                                                                  Nr: start + n.Value,
                                                                  Mal: mal,
                                                                  Svenska: sv,
                                                                  Genus: Coalesce(LookUp(GenusArtiklar, Sprak = valtSprak && Artikel = Lower(First(Split(Trim(mal), " ")).Value), Genus), "")
                                                              }
                                                          )
                                                      )
                                                  )
                                              )
                                          )
                                      );
                                      Reset(txtImport)
                                    Appearance: =ButtonAppearance.Primary
                                    BasePaletteColor: =Tema.Primar
                                    Height: =40
                                    FillPortions: =1
                              - btnByt:
                                  Control: ModernButton@1.0.0
                                  Properties:
                                    Text: ="⇄ Byt plats på språken"
                                    OnSelect: |-
                                      =ClearCollect(colImportTmp, colImport);
                                      ClearCollect(
                                          colImport,
                                          ForAll(
                                              colImportTmp As r,
                                              {
                                                  Nr: r.Nr,
                                                  Mal: r.Svenska,
                                                  Svenska: r.Mal,
                                                  Genus: Coalesce(LookUp(GenusArtiklar, Sprak = txtGlosSprak.Text && Artikel = Lower(First(Split(Trim(r.Svenska), " ")).Value), Genus), "")
                                              }
                                          )
                                      );
                                      Clear(colImportTmp)
                                    Appearance: =ButtonAppearance.Secondary
                                    BasePaletteColor: =Tema.Primar
                                    Height: =40
                                    FillPortions: =1
                        - conEnGlosa:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              LayoutDirection: =LayoutDirection.Horizontal
                              LayoutAlignItems: =LayoutAlignItems.Stretch
                              LayoutGap: =8
                              Fill: =RGBA(0, 0, 0, 0)
                              DropShadow: =DropShadow.None
                              Height: =40
                            Children:
                              - txtMal:
                                  Control: ModernTextInput@1.1.2
                                  Properties:
                                    Default: =""
                                    Placeholder: ="Målspråk, t.ex. la casa"
                                    Height: =40
                                    FillPortions: =1
                              - txtSv:
                                  Control: ModernTextInput@1.1.2
                                  Properties:
                                    Default: =""
                                    Placeholder: ="Svenska, t.ex. huset"
                                    Height: =40
                                    FillPortions: =1
                              - btnLaggTill:
                                  Control: ModernButton@1.0.0
                                  Properties:
                                    Text: ="+ Lägg till"
                                    OnSelect: |-
                                      =If(
                                          !IsBlank(Trim(txtMal.Text)),
                                          Collect(
                                              colImport,
                                              {
                                                  Nr: Coalesce(Max(colImport, Nr), 0) + 1,
                                                  Mal: Trim(txtMal.Text),
                                                  Svenska: Trim(txtSv.Text),
                                                  Genus: Coalesce(LookUp(GenusArtiklar, Sprak = txtGlosSprak.Text && Artikel = Lower(First(Split(Trim(txtMal.Text), " ")).Value), Genus), "")
                                              }
                                          );
                                          Reset(txtMal);
                                          Reset(txtSv);
                                          SetFocus(txtMal)
                                      )
                                    Appearance: =ButtonAppearance.Primary
                                    BasePaletteColor: =Tema.Primar
                                    Height: =40
                                    Width: =110
                        - conImportRubriker:
                            Control: GroupContainer@1.5.0
                            Variant: AutoLayout
                            Properties:
                              LayoutDirection: =LayoutDirection.Horizontal
                              LayoutAlignItems: =LayoutAlignItems.Stretch
                              LayoutGap: =8
                              Fill: =RGBA(0, 0, 0, 0)
                              DropShadow: =DropShadow.None
                              Height: =22
                            Children:
                              - txtImpRubMal:
                                  Control: ModernText@1.0.0
                                  Properties:
                                    Text: ="Målspråk"
                                    Size: =10
                                    Color: =Tema.TextDampad
                                    Height: =22
                                    FillPortions: =1
                              - txtImpRubSv:
                                  Control: ModernText@1.0.0
                                  Properties:
                                    Text: ="Svenska"
                                    Size: =10
                                    Color: =Tema.TextDampad
                                    Height: =22
                                    FillPortions: =1
                              - txtImpRubGenus:
                                  Control: ModernText@1.0.0
                                  Properties:
                                    Text: ="Genus"
                                    Size: =10
                                    Color: =Tema.TextDampad
                                    Height: =22
                                    Width: =120
                        - galImport:
                            Control: Gallery@2.15.0
                            Variant: BrowseLayout_Vertical_TwoTextOneImageVariant_ver5.0
                            Properties:
                              Items: =colImport
                              TemplateSize: =48
                              TemplatePadding: =0
                              FillPortions: =1
                              LayoutMinHeight: =160
                              Fill: =RGBA(0, 0, 0, 0)
                              BorderThickness: =0
                              ShowScrollbar: =true
                            Children:
                              - txtRadMal:
                                  Control: ModernTextInput@1.1.2
                                  Properties:
                                    Default: =ThisItem.Mal
                                    Placeholder: =""
                                    Height: =40
                                    Color: =Switch(ThisItem.Genus, "f", Tema.GenusF, "m", Tema.GenusM, "n", Tema.GenusN, Tema.Brodtext)
                                    OnChange: |-
                                      =Patch(colImport, LookUp(colImport, Nr = ThisItem.Nr), { Mal: Self.Text })
                                    X: =4
                                    Y: =4
                                    Width: =(Parent.TemplateWidth - 140) / 2
                              - txtRadSv:
                                  Control: ModernTextInput@1.1.2
                                  Properties:
                                    Default: =ThisItem.Svenska
                                    Placeholder: =""
                                    Height: =40
                                    OnChange: |-
                                      =Patch(colImport, LookUp(colImport, Nr = ThisItem.Nr), { Svenska: Self.Text })
                                    X: =8 + (Parent.TemplateWidth - 140) / 2
                                    Y: =4
                                    Width: =(Parent.TemplateWidth - 140) / 2
                              - btnRadGenus:
                                  Control: ModernButton@1.0.0
                                  Properties:
                                    Text: =Switch(ThisItem.Genus, "m", "mask.", "f", "fem.", "n", "neutr.", "genus")
                                    OnSelect: |-
                                      =Patch(colImport, LookUp(colImport, Nr = ThisItem.Nr), { Genus: Switch(ThisItem.Genus, "m", "f", "f", "n", "n", "", "m") })
                                    Appearance: =If(IsBlank(ThisItem.Genus), ButtonAppearance.Secondary, ButtonAppearance.Primary)
                                    BasePaletteColor: =Switch(ThisItem.Genus, "f", Tema.GenusF, "m", Tema.GenusM, "n", Tema.GenusN, Tema.Primar)
                                    Height: =36
                                    X: =Parent.TemplateWidth - 124
                                    Y: =6
                                    Width: =78
                              - btnRadTaBort:
                                  Control: ModernButton@1.0.0
                                  Properties:
                                    Text: ="✕"
                                    OnSelect: =Remove(colImport, LookUp(colImport, Nr = ThisItem.Nr))
                                    Appearance: =ButtonAppearance.Subtle
                                    BasePaletteColor: =Tema.Primar
                                    Height: =36
                                    X: =Parent.TemplateWidth - 42
                                    Y: =6
                                    Width: =38
                              - rectRadLinje:
                                  Control: Rectangle@2.3.0
                                  Properties:
                                    X: =0
                                    Y: =Parent.TemplateHeight - 1
                                    Width: =Parent.TemplateWidth
                                    Height: =1
                                    Fill: =Tema.Linje
                        - txtImportVarning:
                            Control: ModernText@1.0.0
                            Properties:
                              Text: =If(CountRows(Filter(colImport, IsBlank(Trim(Svenska)) || IsBlank(Trim(Mal)))) > 0, "Någon rad saknar ord.", IsBlank(txtGlosSprak.Text), "Välj bok eller språk först.", !IsBlank(cmbBok.Selected.ID) && IsBlank(cmbKapitel.Selected.ID), "Välj kapitel först.", "")
                              Size: =10
                              Color: =Tema.Fel
                              Height: =22
                        - btnSparaGlosor:
                            Control: ModernButton@1.0.0
                            Properties:
                              Text: ="Spara " & CountRows(colImport) & " glosor"
                              OnSelect: |-
                                =With(
                                    {
                                        bok: Coalesce(cmbBok.Selected.ID, 0),
                                        kap: Coalesce(cmbKapitel.Selected.ID, 0),
                                        valtSprak: txtGlosSprak.Text,
                                        antal: CountRows(colImport)
                                    },
                                    Collect(
                                        glosor_glosor,
                                        ForAll(
                                            colImport As r,
                                            {
                                                Title: Trim(r.Mal),
                                                Svenska: Trim(r.Svenska),
                                                Genus: r.Genus,
                                                Sprak: valtSprak,
                                                BokID: bok,
                                                KapitelID: kap,
                                                SkapadAv: User().FullName,
                                                SkapadAvEpost: User().Email
                                            }
                                        )
                                    );
                                    If(
                                        IsEmpty(Errors(glosor_glosor)),
                                        Notify(antal & " glosor sparades.", NotificationType.Success);
                                        Clear(colImport),
                                        Notify("Något gick fel: " & First(Errors(glosor_glosor)).Message, NotificationType.Error)
                                    )
                                )
                              Appearance: =ButtonAppearance.Primary
                              BasePaletteColor: =Tema.Primar
                              Height: =48
                              DisplayMode: =If(CountRows(colImport) > 0 && IsBlank(txtImportVarning.Text), DisplayMode.Edit, DisplayMode.Disabled)
                  - conGlosBefintliga:
                      Control: GroupContainer@1.5.0
                      Variant: AutoLayout
                      Properties:
                        LayoutDirection: =LayoutDirection.Vertical
                        LayoutAlignItems: =LayoutAlignItems.Stretch
                        LayoutGap: =8
                        Fill: =Tema.Yta
                        DropShadow: =DropShadow.None
                        BorderColor: =Tema.Linje
                        BorderThickness: =1
                        RadiusTopLeft: =12
                        RadiusTopRight: =12
                        RadiusBottomLeft: =12
                        RadiusBottomRight: =12
                        PaddingTop: =16
                        PaddingBottom: =16
                        PaddingLeft: =16
                        PaddingRight: =16
                        LayoutOverflowY: =LayoutOverflow.Scroll
                        FillPortions: =3
                        LayoutMinWidth: =320
                      Children:
                        - txtBefintliga:
                            Control: ModernText@1.0.0
                            Properties:
                              Text: ="Redan inlagda här (" & CountRows(galBefintliga.AllItems) & ")"
                              Size: =14
                              Color: =Tema.Brodtext
                              Height: =30
                              FontWeight: =FontWeight.Semibold
                        - txtBefintligaInfo:
                            Control: ModernText@1.0.0
                            Properties:
                              Text: ="Alla lärare kan fylla på samma kapitel. Ändringar sparas direkt."
                              Size: =10
                              Color: =Tema.TextDampad
                              Height: =22
                        - galBefintliga:
                            Control: Gallery@2.15.0
                            Variant: BrowseLayout_Vertical_TwoTextOneImageVariant_ver5.0
                            Properties:
                              Items: |-
                                =If(
                                    !IsBlank(cmbKapitel.Selected.ID),
                                    Filter(glosor_glosor, KapitelID = cmbKapitel.Selected.ID),
                                    IsBlank(cmbBok.Selected.ID) && !IsBlank(cmbSprak.Selected.Kod),
                                    Filter(glosor_glosor, BokID = 0, Sprak = cmbSprak.Selected.Kod),
                                    Filter(glosor_glosor, ID = -1)
                                )
                              TemplateSize: =48
                              TemplatePadding: =0
                              FillPortions: =1
                              LayoutMinHeight: =160
                              Fill: =RGBA(0, 0, 0, 0)
                              BorderThickness: =0
                              ShowScrollbar: =true
                            Children:
                              - txtBefMal:
                                  Control: ModernTextInput@1.1.2
                                  Properties:
                                    Default: =ThisItem.Title
                                    Placeholder: =""
                                    Height: =40
                                    Color: =Switch(ThisItem.Genus, "f", Tema.GenusF, "m", Tema.GenusM, "n", Tema.GenusN, Tema.Brodtext)
                                    OnChange: |-
                                      =Patch(glosor_glosor, ThisItem, { Title: Trim(Self.Text) })
                                    X: =4
                                    Y: =4
                                    Width: =(Parent.TemplateWidth - 140) / 2
                              - txtBefSv:
                                  Control: ModernTextInput@1.1.2
                                  Properties:
                                    Default: =ThisItem.Svenska
                                    Placeholder: =""
                                    Height: =40
                                    OnChange: |-
                                      =Patch(glosor_glosor, ThisItem, { Svenska: Trim(Self.Text) })
                                    X: =8 + (Parent.TemplateWidth - 140) / 2
                                    Y: =4
                                    Width: =(Parent.TemplateWidth - 140) / 2
                              - btnBefGenus:
                                  Control: ModernButton@1.0.0
                                  Properties:
                                    Text: =Switch(ThisItem.Genus, "m", "mask.", "f", "fem.", "n", "neutr.", "genus")
                                    OnSelect: |-
                                      =Patch(glosor_glosor, ThisItem, { Genus: Switch(ThisItem.Genus, "m", "f", "f", "n", "n", "", "m") })
                                    Appearance: =If(IsBlank(ThisItem.Genus), ButtonAppearance.Secondary, ButtonAppearance.Primary)
                                    BasePaletteColor: =Switch(ThisItem.Genus, "f", Tema.GenusF, "m", Tema.GenusM, "n", Tema.GenusN, Tema.Primar)
                                    Height: =36
                                    X: =Parent.TemplateWidth - 124
                                    Y: =6
                                    Width: =78
                              - btnBefTaBort:
                                  Control: ModernButton@1.0.0
                                  Properties:
                                    Text: ="✕"
                                    OnSelect: =Remove(glosor_glosor, ThisItem)
                                    Appearance: =ButtonAppearance.Subtle
                                    BasePaletteColor: =Tema.Primar
                                    Height: =36
                                    Visible: =ThisItem.SkapadAvEpost = User().Email
                                    X: =Parent.TemplateWidth - 42
                                    Y: =6
                                    Width: =38
                              - rectBefLinje:
                                  Control: Rectangle@2.3.0
                                  Properties:
                                    X: =0
                                    Y: =Parent.TemplateHeight - 1
                                    Width: =Parent.TemplateWidth
                                    Height: =1
                                    Fill: =Tema.Linje
